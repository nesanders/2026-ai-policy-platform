<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A Democratic platform on artificial intelligence: curb Big Tech's power, build AI for public benefit, put people in charge of how AI is used, and fix the democracy AI is being used to subvert.">
<meta property="og:title" content="Making AI Work for Us">
<meta property="og:description" content="A Democratic platform on artificial intelligence: curb Big Tech's power, build AI for public benefit, put people in charge of how AI is used, and fix the democracy AI is being used to subvert.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<title>Making AI Work for Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one civic reading column for the argument, a wider grid for the planks; the boldness lives in the signage-style hero type. */
:root {
  --paper: #f3f5f9;
  --panel: #e5eaf3;
  --ink: #111a2c;
  --muted: #4a5571;
  --rule: #cdd5e3;
  --accent: #1b41c0;
  --signal: #b37500;
  --ins-bg: #dbe9d4;
  --ins-line: #2f7a2a;
  --del-line: #c0392b;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c111d; --panel: #151d30; --ink: #e6eaf3; --muted: #a3adc4;
    --rule: #29334b; --accent: #8ca6ff; --signal: #f0b648; color-scheme: dark;
    --ins-bg: #1d3320; --ins-line: #7fd37a; --del-line: #ff7a6b;
  }
}
:root[data-theme="dark"] {
  --paper: #0c111d; --panel: #151d30; --ink: #e6eaf3; --muted: #a3adc4;
  --rule: #29334b; --accent: #8ca6ff; --signal: #f0b648; color-scheme: dark;
  --ins-bg: #1d3320; --ins-line: #7fd37a; --del-line: #ff7a6b;
}

.crumbs { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: var(--paper); border-bottom: 1px solid var(--rule); font-family: var(--f-mono); font-size: 0.78rem; transform: translateY(-110%); transition: transform 0.18s ease; }
.crumbs.show { transform: none; }
.crumbs-inner { max-width: 72rem; margin: 0 auto; padding: 0.55rem 16px; display: flex; align-items: center; gap: 0.75rem; }
.crumbs ol { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; min-width: 0; flex: 1; overflow: hidden; }
.crumbs li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumbs li:not(:last-child) { flex-shrink: 0; max-width: 40%; }
.crumbs li + li::before { content: "›"; color: var(--muted); padding: 0 0.5rem; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs li:last-child a { color: var(--ink); }
.crumbs-btn { flex-shrink: 0; font: inherit; color: var(--ink); background: none; border: 1px solid var(--rule); border-radius: 2px; padding: 0.2rem 0.55rem; cursor: pointer; }
.crumbs-btn:hover, .crumbs-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.crumbs-menu { display: none; max-width: 72rem; margin: 0 auto; padding: 0.25rem 16px 0.8rem; }
.crumbs.open .crumbs-menu { display: block; }
.crumbs-menu a { display: block; padding: 0.3rem 0; color: var(--ink); text-decoration: none; }
.crumbs-menu a.sub { padding-left: 1.2rem; color: var(--muted); }
.crumbs-menu a.here { color: var(--accent); }
.crumbs-menu a:hover { color: var(--accent); }
section[id], #framework, header.hero { scroll-margin-top: 3.2rem; }
@media print { .crumbs { display: none; } }
@media (max-width: 640px) { .crumbs li:first-child:not(:last-child) { display: none; } .crumbs li:nth-child(2)::before { content: none; } .crumbs li:not(:last-child) { max-width: 34%; } }
details.more { border-top: 1px solid var(--rule); padding-top: 1.1rem; }
details.more > summary { cursor: pointer; list-style: none; font-family: var(--f-mono); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); display: inline-flex; gap: 0.5rem; align-items: center; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; display: inline-grid; place-items: center; width: 1.2rem; height: 1.2rem; border: 1px solid currentColor; border-radius: 2px; }
details.more[open] > summary::before { content: "\2212"; }
details.more > summary:hover { color: var(--ink); }
.more-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 1.8rem 2.5rem; padding-top: 1.4rem; align-items: start; }
.more-body .block { display: grid; gap: 0.7rem; min-width: 0; }
.more-body .block:has(.giveaway) { grid-column: 1 / -1; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 1.125rem;
  line-height: 1.62;
}
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band { background: var(--panel); }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
ul { margin: 0; padding: 0; list-style: none; }

.eyebrow, .label {
  font-family: var(--f-mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.prose { max-width: 66ch; display: grid; gap: 1.1rem; }
p.prose { display: block; }
.section { padding-block: 4.5rem; display: grid; gap: 2rem; }
.section + .section { border-top: 1px solid var(--rule); }
h2 {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: clamp(2.1rem, 5.2vw, 3.2rem);
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.01em;
}
.section-head { display: grid; gap: 0.75rem; }

/* Hero */
.hero { padding-block: 4rem 3rem; display: grid; gap: 1.6rem; }
.hero h1 {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(3.4rem, 12.5vw, 8.4rem);
  line-height: 0.86;
  text-transform: uppercase;
  letter-spacing: 0.005em;
}
.hero h1 .us { color: var(--accent); display: block; }
.dek { font-size: clamp(1.2rem, 2.4vw, 1.45rem); line-height: 1.45; max-width: 44ch; }
.toc { display: flex; flex-wrap: wrap; gap: 0.5rem 1.4rem; font-family: var(--f-mono); font-size: 0.8rem; padding-top: 0.5rem; }
.toc a { text-decoration: none; border-bottom: 1px solid var(--rule); }
.toc a:hover { border-bottom-color: var(--accent); }

/* Thesis */
.thesis-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 20rem); gap: 3rem; align-items: start; }
blockquote.pull {
  margin: 0;
  font-family: var(--f-body);
  font-style: italic;
  font-size: 1.2rem;
  line-height: 1.45;
  display: grid;
  gap: 0.6rem;
  padding-left: 1.1rem;
  border-left: 3px solid var(--accent);
}
blockquote.pull cite { font-style: normal; font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.5rem 2rem; }
.stat { display: grid; gap: 0.35rem; align-content: start; }
.stat-num { font-family: var(--f-display); font-weight: 900; font-size: 3.2rem; line-height: 0.95; font-variant-numeric: tabular-nums; color: var(--accent); }
.stat-label { font-size: 0.98rem; line-height: 1.4; }
.stat-src { font-family: var(--f-mono); font-size: 0.7rem; color: var(--muted); }

/* Principles */
.principles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2rem; counter-reset: p; }
.principle { display: grid; gap: 0.5rem; align-content: start; }
.p-num { font-family: var(--f-display); font-weight: 900; font-size: 3.4rem; line-height: 0.9; color: var(--accent); }
.p-text { font-family: var(--f-display); font-weight: 800; font-size: 1.75rem; line-height: 1.02; text-transform: uppercase; }
.p-note { font-size: 0.98rem; color: var(--muted); line-height: 1.45; }

/* Framework: principle → action */
.fw-cols, .fw-row { display: grid; grid-template-columns: minmax(0, 1fr) 5rem minmax(0, 1.2fr); }
.fw-cols { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: -1rem; }
ol.framework { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.25rem; }
.fw-row { align-items: center; }
.fw-principle { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: 0.6rem; align-items: start; }
.fw-num { font-family: var(--f-display); font-weight: 900; font-size: 3rem; line-height: 0.85; color: var(--accent); }
.fw-p-text { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; line-height: 1.02; text-transform: uppercase; }
.fw-p-note { font-size: 0.95rem; color: var(--muted); line-height: 1.45; margin-top: 0.35rem; }
.fw-arrow { position: relative; height: 1.6rem; margin-inline: 0.6rem; }
.fw-arrow::before { content: ""; position: absolute; left: 0; right: 0.7rem; top: 50%; height: 3px; transform: translateY(-50%); background: var(--accent); }
.fw-arrow::after { content: ""; position: absolute; right: 0; top: 50%; transform: translateY(-50%); border-top: 0.55rem solid transparent; border-bottom: 0.55rem solid transparent; border-left: 0.8rem solid var(--accent); }
.fw-action { background: var(--paper); border: 2px solid var(--accent); border-radius: 4px; padding: 1rem 1.2rem 1.1rem; display: grid; gap: 0.6rem; }
.fw-action h3 { font-family: var(--f-display); font-weight: 900; font-size: 1.75rem; line-height: 1; text-transform: uppercase; }
.fw-action h3 a { color: var(--accent); text-decoration: none; }
.fw-action h3 a:hover { text-decoration: underline; }
.fw-action dl { margin: 0; display: grid; gap: 0.2rem; font-size: 1rem; line-height: 1.45; }
.fw-problem { margin-top: 0.7rem; font-size: 0.95rem; line-height: 1.45; color: var(--ink); }
.fw-tag { display: block; font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--signal); margin-bottom: 0.15rem; }
.fw-action dt { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 0.2rem; }
.fw-action dd { margin: 0; }
.fw-action dd.fw-instead { color: var(--muted); }
.fw-across { border-top: 2px solid var(--ink); padding-top: 1rem; display: grid; gap: 0.3rem; max-width: 60ch; }
.plank-principle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.6rem; font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; text-transform: uppercase; color: var(--accent); line-height: 1.1; }
@media (max-width: 760px) {
  .fw-cols { display: none; }
  .fw-row { grid-template-columns: minmax(0, 1fr); }
  .fw-arrow { height: 2.2rem; width: 1.6rem; margin: 0.3rem 0 0.3rem 0.5rem; }
  .fw-arrow::before { left: 50%; right: auto; top: 0; bottom: 0.7rem; width: 3px; height: auto; transform: translateX(-50%); }
  .fw-arrow::after { right: auto; left: 50%; top: auto; bottom: 0; transform: translateX(-50%); border-left: 0.55rem solid transparent; border-right: 0.55rem solid transparent; border-top: 0.8rem solid var(--accent); border-bottom: 0; }
  .fw-action dl { grid-template-columns: minmax(0, 1fr); gap: 0.15rem; }
  .fw-action dd + dt { margin-top: 0.4rem; }
}

/* Tables */
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th { font-family: var(--f-mono); font-weight: 500; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0 1rem 0.7rem 0; border-bottom: 2px solid var(--ink); }
td { padding: 1rem 1rem 1rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.45; }
td.row-head { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; text-transform: uppercase; line-height: 1; white-space: nowrap; }
td.row-head a { color: var(--ink); text-decoration: none; }
td.row-head a:hover { color: var(--accent); }
td.instead { color: var(--muted); }
.contrast td { font-size: 1rem; }
.contrast td.ours { font-weight: 600; }

/* Planks */
.plank { padding-block: 4.5rem; display: grid; gap: 2rem; border-top: 1px solid var(--rule); scroll-margin-top: 1rem; }
.plank-head { display: grid; gap: 0.7rem; }
.plank-head h2 { font-size: clamp(2.6rem, 7vw, 4.4rem); }
.plank-lead { font-size: clamp(1.2rem, 2.2vw, 1.4rem); line-height: 1.45; max-width: 52ch; }
.plank-body { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 2.5rem; align-items: start; }
.plank-main { display: grid; gap: 1.8rem; min-width: 0; }
.block { display: grid; gap: 0.8rem; }
ul.do { display: grid; gap: 0.85rem; }
ul.do li { position: relative; padding-left: 1.35rem; }
ul.do li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 0.55rem; height: 0.55rem; background: var(--accent); }
ul.do li strong { font-weight: 600; }
.note { font-size: 0.98rem; color: var(--muted); line-height: 1.5; max-width: 62ch; }
.callout { background: var(--panel); padding: 1.2rem 1.4rem; border-radius: 4px; display: grid; gap: 0.6rem; font-size: 1rem; }
.callout h3 { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; text-transform: uppercase; line-height: 1; }

aside.evidence { background: var(--panel); border-radius: 4px; padding: 1.4rem 1.5rem 1.6rem; display: grid; gap: 1.6rem; min-width: 0; }
.ev-group { display: grid; gap: 0.75rem; }
ul.record { display: grid; gap: 0.95rem; font-size: 0.97rem; line-height: 1.45; }
ul.record li { display: block; }
ul.record b { font-weight: 600; display: block; }
.who { display: block; margin-block: 0.1rem 0.15rem; font-family: var(--f-mono); font-size: 0.7rem; color: var(--muted); letter-spacing: 0.03em; }

.giveaway { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 1.5rem; }
.giveaway li { display: block; font-size: 1rem; line-height: 1.45; padding-top: 0.7rem; border-top: 2px solid var(--signal); }
.giveaway b { display: block; margin-bottom: 0.25rem; font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; text-transform: uppercase; line-height: 1.05; }

/* Reframes, path */
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.2rem; }
.trio > div { display: grid; gap: 0.7rem; align-content: start; min-width: 0; }
.trio h3 { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; text-transform: uppercase; line-height: 1.02; }
.trio p { font-size: 1rem; line-height: 1.55; }
.trio.quad { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.6rem 3rem; }
.trio ul.do { font-size: 1rem; }
.year { font-family: var(--f-mono); font-weight: 500; font-size: 0.85rem; color: var(--accent); letter-spacing: 0.06em; }

/* Log */
.log { display: grid; gap: 1.2rem; font-size: 0.98rem; }
.log-entry { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 1rem; }
.log-entry .label { padding-top: 0.2rem; }
ul.open { display: grid; gap: 0.5rem; list-style: disc; padding-left: 1.2rem; }
footer { padding-block: 2.5rem 3.5rem; border-top: 1px solid var(--rule); font-size: 0.9rem; color: var(--muted); }

@media (max-width: 900px) {
  .principles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .thesis-grid, .plank-body { grid-template-columns: minmax(0, 1fr); }
  .trio, .trio.quad { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .principles { grid-template-columns: minmax(0, 1fr); }
  .giveaway { grid-template-columns: minmax(0, 1fr); }
  .log-entry { grid-template-columns: minmax(0, 1fr); gap: 0.3rem; }
  .stat-num { font-size: 2.6rem; }
  .section, .plank { padding-block: 3.2rem; }
}
</style>
</head>
<body>
<style>
.lock { min-height: 70vh; display: grid; place-items: center; padding-block: 3rem; }
.lock-card { width: min(100%, 26rem); display: grid; gap: 1rem; }
.lock-card h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(2.6rem, 9vw, 3.6rem); line-height: 0.9; text-transform: uppercase; }
.lock-card h1 span { color: var(--accent); display: block; }
.lock-card p { font-size: 1rem; color: var(--muted); }
.lock-card form { display: grid; gap: 0.6rem; }
.lock-card label { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lock-card input { font: inherit; font-size: 1.05rem; padding: 0.7rem 0.85rem; border: 2px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); }
.lock-card input:focus-visible { outline: none; border-color: var(--accent); }
.lock-card button { font: inherit; font-weight: 600; padding: 0.7rem 1rem; border: 0; border-radius: 4px; background: var(--accent); color: var(--paper); cursor: pointer; }
.lock-card button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.lock-card button[disabled] { opacity: 0.6; cursor: progress; }
.lock-msg { min-height: 1.4em; font-size: 0.95rem; color: var(--del-line); }
</style>
<div class="wrap lock" id="lock">
  <div class="lock-card">
    <h1>Making AI<span>work for us.</span></h1>
    <p>This draft is shared for review. Enter the passcode you were given to read it.</p>
    <form id="lock-form" autocomplete="off">
      <label for="lock-pass">Passcode</label>
      <input id="lock-pass" type="password" autocapitalize="none" spellcheck="false" required>
      <button type="submit" id="lock-btn">Unlock</button>
      <p class="lock-msg" id="lock-msg" role="status"></p>
    </form>
  </div>

<script>
(function () {
  var data = JSON.parse(document.getElementById("payload").textContent);
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  async function decrypt(pass) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(data.salt), iterations: data.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(data.iv) }, key, bytes(data.ct));
    return new TextDecoder().decode(out);
  }
  function show(html) {
    var box = document.getElementById("content");
    box.innerHTML = html;
    box.querySelectorAll("script").forEach(function (old) {
      var s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
    document.getElementById("lock").remove();
    if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }
  var form = document.getElementById("lock-form"), input = document.getElementById("lock-pass"),
      btn = document.getElementById("lock-btn"), msg = document.getElementById("lock-msg");
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var pass = input.value.trim().toLowerCase().replace(/\s+/g, "-");
    btn.disabled = true; msg.textContent = "Unlocking…";
    try {
      var html = await decrypt(pass);
      try { sessionStorage.setItem("maiwfu-pass", pass); } catch (err) {}
      show(html);
    } catch (err) {
      msg.textContent = "That passcode didn't work. Check the spelling and try again.";
      btn.disabled = false; input.select();
    }
  });
  var saved = null;
  try { saved = sessionStorage.getItem("maiwfu-pass"); } catch (err) {}
  if (saved) { decrypt(saved).then(show).catch(function () {}); }
  input.focus();
})();
</script>
